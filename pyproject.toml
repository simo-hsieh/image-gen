[project]
name = "image-gen"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "diffusers>=0.25",
    "transformers>=4.36",
    "accelerate>=0.25",
    "controlnet_aux>=0.0.7",
    "safetensors",
    "omegaconf",
    "Pillow",
    "torch>=2.1",
]

[project.optional-dependencies]
serve = [
    "ray[serve]>=2.9",
    "requests",
    "fastapi",
]
